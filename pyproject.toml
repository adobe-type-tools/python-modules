[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "afdko-python-modules"
version = "2.0.0"
description = "Python modules for writing kern feature, mark feature, and GlyphOrderAndAliasDB files"
readme = "README.md"
license = {text = "MIT License"}
authors = [
    {name = "Miguel Sousa", email = "afdko@adobe.com"},
    {name = "Skef Iterum", email = "afdko@adobe.com"},
    {name = "Frank Grießhammer", email = "afdko@adobe.com"},
]
maintainers = [
    {name = "Frank Grießhammer", email = "afdko@adobe.com"}
]
keywords = ["fonts", "typography", "afdko", "ufo", "opentype", "kerning", "mark", "goadb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Fonts",
]
requires-python = ">=3.6"
dependencies = [
    "afdko",
]

[project.urls]
Homepage = "https://github.com/adobe-type-tools/python-modules"
Repository = "https://github.com/adobe-type-tools/python-modules"
Issues = "https://github.com/adobe-type-tools/python-modules/issues"

[project.scripts]
kernFeatureWriter = "kernFeatureWriter:main"
markFeatureWriter = "markFeatureWriter:main"
goadbWriter = "goadbWriter:main"

[tool.setuptools]
py-modules = [
    "kernFeatureWriter",
    "markFeatureWriter",
    "goadbWriter",
]

[tool.setuptools_scm]
write_to = "_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]

[tool.coverage.run]
source = ["kernFeatureWriter", "markFeatureWriter", "goadbWriter"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
